services:
  app:
    container_name: twitch-rewards
    image: adai1ne/twitch-rewards:latest
    build: .
    ports:
      - '127.0.0.1:5151:5151'
    depends_on:
      - db
    env_file:
      - .env
    restart: unless-stopped

  db:
    container_name: twitch-rewards-db
    image: postgres:16-alpine
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - db:/var/lib/postgresql/data
    env_file:
      - .env
    restart: unless-stopped

volumes:
  db:
    driver: local
